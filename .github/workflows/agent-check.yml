name: Build editor and agent fallback
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the existing test suite before building
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without clark.agent checkout
        run: npm ci
      - name: Run optional tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        run: npm test
      - name: Build independent editor
        run: npm run build:release
