name: Task editor workbench
on:
  push:
    branches: [feat/task-editor-guide-20260923]
    paths: [.github/workflows/task-editor-workbench.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover known prepared objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/task-recovery
          python - <<'PY'
          import base64,hashlib,json,subprocess,concurrent.futures
          from pathlib import Path
          root=Path('/tmp/task-recovery')
          hashes='''dc1bb16a01ffec4854471a34f8940755be2ba2a3
