          def read(sha):
              p=subprocess.run(['gh','api','repos/y26084670-blip/web-gui/git/blobs/'+sha],capture_output=True)
              if p.returncode: return {'sha':sha,'found':False}
              obj=json.loads(p.stdout);data=base64.b64decode(obj['content'])
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==sha
              (root/(sha+'.bin')).write_bytes(data)
              return {'sha':sha,'found':True,'size':len(data)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: results=list(pool.map(read,hashes))
          (root/'manifest.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
