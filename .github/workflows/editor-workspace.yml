name: Editor verification workspace
on:
  push:
    branches: [work/editor-coil-shortcuts-mu-20261006]
    paths: [.github/workflows/editor-workspace.yml]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply checked editor patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          data = ''.join(pathlib.Path(f'.github/editor-update.part{i}').read_text().strip() for i in range(1, 5))
          patch = gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '9bb7a1c0d32d42fe785c2b6bb22064d87f934283902ef7ebb9a638f3800e44d0'
          pathlib.Path('/tmp/editor.patch').write_bytes(patch)
          PY
          git apply --check /tmp/editor.patch
          git apply /tmp/editor.patch
      - run: npm ci
      - name: Focused tests
        run: node --test test/uniformFieldCoil.test.js test/geometryCameraView.test.js test/constantMuFmm.test.js test/modelSaveShortcut.test.js test/fmmTableInput.test.js
      - name: Commit implementation on work branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test scripts/check-editor-features-browser.mjs
          git commit -m 'feat: extend coil generator, editor shortcuts and constant-mu materials'
          git push origin HEAD:work/editor-coil-shortcuts-mu-20261006
      - run: npm run assets:prepare
      - name: Install browser test tools outside project
        shell: bash
        run: |
          npm install --prefix /tmp/editor-playwright --no-save --package-lock=false playwright
          /tmp/editor-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual editor browser workflows
        env:
          PLAYWRIGHT_MODULE: /tmp/editor-playwright/node_modules/playwright/index.mjs
          CHECK_OUTPUT: /tmp/editor-features-browser
        run: node scripts/check-editor-features-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-browser-evidence
          path: /tmp/editor-features-browser
          retention-days: 1
