name: Editor verification workspace
on:
  push:
    branches: [work/editor-coil-shortcuts-mu-20261006]
    paths: [.github/workflows/editor-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack public sources and verification dependencies
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules -czf /tmp/editor-source.tgz .
          tar -czf /tmp/editor-deps.tgz node_modules
          cp "$(command -v node)" /tmp/editor-node
      - uses: actions/upload-artifact@v4
        with:
          name: editor-source
          path: /tmp/editor-source.tgz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: editor-dependencies
          path: |
            /tmp/editor-deps.tgz
            /tmp/editor-node
          retention-days: 1
