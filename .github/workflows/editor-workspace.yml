name: Editor verification workspace
on:
  push:
    branches: [work/editor-coil-shortcuts-mu-20261006]
    paths: [.github/workflows/editor-workspace.yml]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply integrity-checked final changes
        shell: bash
        run: |
          mkdir -p /tmp/editor-features-browser
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          data = ''.join(pathlib.Path(f'.github/editor-final.part{i}').read_text().strip() for i in range(1, 4))
          data = data.replace('K1sqzN6n+rsh', 'K1sqzNqHGbzN6n+rsh', 1)
          patch = gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == '13c6dc4e0672ac0882411964cf3007cd560f5288748e3b38cf7239f3fa80789a'
          pathlib.Path('/tmp/editor-features-browser/final-docs.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/editor-features-browser/final-docs.patch
          git apply --unidiff-zero /tmp/editor-features-browser/final-docs.patch
      - run: npm ci
      - name: Focused tests
        shell: bash
        run: node --test test/uniformFieldCoil.test.js test/geometryCameraView.test.js test/constantMuFmm.test.js test/modelSaveShortcut.test.js test/fmmTableInput.test.js 2>&1 | tee /tmp/editor-features-browser/focused-tests.log
      - name: Release build
        shell: bash
        run: npm run build:release 2>&1 | tee /tmp/editor-features-browser/build-release.log
      - name: Pages build and asset verification
        shell: bash
        run: |
          npm run build:pages 2>&1 | tee /tmp/editor-features-browser/build-pages.log
          npm run assets:verify 2>&1 | tee /tmp/editor-features-browser/assets-verify.log
      - name: Install browser test tools outside project
        shell: bash
        run: |
          npm install --prefix /tmp/editor-playwright --no-save --package-lock=false playwright
          /tmp/editor-playwright/node_modules/.bin/playwright install chromium
      - name: Actual editor browser workflows and contrast checks
        env:
          PLAYWRIGHT_MODULE: /tmp/editor-playwright/node_modules/playwright/index.mjs
          CHECK_OUTPUT: /tmp/editor-features-browser
        run: node scripts/check-editor-features-browser.mjs
      - name: Record evidence and remove temporary transport files
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result=json.loads(pathlib.Path('/tmp/editor-features-browser/results.json').read_text())
          assert result['passed']==31 and len(result['checks'])==31 and result['errors']==[]
          result['version']='4.45.0'
          result['workflow']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          result['inputCommit']=os.environ['GITHUB_SHA']
          p=pathlib.Path('docs/verification/editor-445-browser.json');p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('/tmp/editor-features-browser/editor-445-browser.json').write_bytes(p.read_bytes())
          for i in range(1,5): pathlib.Path(f'.github/editor-update.part{i}').unlink()
          for i in range(1,4): pathlib.Path(f'.github/editor-final.part{i}').unlink()
          pathlib.Path('.github/workflows/editor-workspace.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs package.json package-lock.json scripts/check-editor-features-browser.mjs src/components/elements/UniformFieldCoilDialog.css src/components/materials/ConstantMuFmmDialog.css
          git add -u .github
          git diff --cached --check
          git commit -m 'feat: finalize editor 4.45.0 documentation and verified UI'
          git push origin HEAD:work/editor-coil-shortcuts-mu-20261006
          git rev-parse HEAD > /tmp/editor-features-browser/final-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-445-final-verification
          path: /tmp/editor-features-browser
          retention-days: 3
