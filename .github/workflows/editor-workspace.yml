name: Editor verification workspace
on:
  push:
    branches: [work/editor-coil-shortcuts-mu-20261006]
    paths: [.github/workflows/editor-workspace.yml]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Correct 3D fixture selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-editor-features-browser.mjs')
          p.write_text(p.read_text().replace("page.locator('.geometry-button').click()", "page.locator('button.geometry-button').click()"))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-editor-features-browser.mjs
          git commit -m 'test: select the 3D action rather than its help illustration'
          git push origin HEAD:work/editor-coil-shortcuts-mu-20261006
      - run: npm ci
      - run: npm run assets:prepare
      - name: Install browser test tools outside project
        shell: bash
        run: |
          npm install --prefix /tmp/editor-playwright --no-save --package-lock=false playwright
          /tmp/editor-playwright/node_modules/.bin/playwright install chromium
      - name: Actual editor browser workflows
        env:
          PLAYWRIGHT_MODULE: /tmp/editor-playwright/node_modules/playwright/index.mjs
          CHECK_OUTPUT: /tmp/editor-features-browser
        run: node scripts/check-editor-features-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-browser-evidence
          path: /tmp/editor-features-browser
          retention-days: 1
